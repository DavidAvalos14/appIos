name: Build for Appetize

on:
  push:
    branches: [ main, master ]

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build iOS Simulator App
        run: |
          xcodebuild -project Plantilla.xcodeproj -scheme Plantilla -sdk iphonesimulator -configuration Debug -derivedDataPath build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appetize-build
          path: build/Build/Products/Debug-iphonesimulator/*.app